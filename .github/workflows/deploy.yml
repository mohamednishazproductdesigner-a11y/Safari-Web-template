name: Deploy to GitHub Pages

# Manual only. Netlify is the active host (see netlify.toml) and builds on its
# own from every push; leaving this on `push` too would fail on every commit
# until Pages is enabled. Run it from the Actions tab if you want Pages as
# well, and add the `push` trigger back if it becomes the primary host.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# let a running deploy finish rather than cancelling it mid-publish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Pages serves a project repo from /<repo-name>/ — vite.config.js
          # reads this so every asset path resolves under that sub-path.
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
